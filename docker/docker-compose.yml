version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecovision-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecovision_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecovision-network

  # 2. Python FastAPI AI Microservice
  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai-service
    container_name: ecovision-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - ecovision-network

  # 3. Express REST API Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: ecovision-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ecovision_db?schema=public
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=ecovision-super-secret-jwt-key-2026
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - ecovision-network

  # 4. Next.js 15 Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ecovision-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_AI_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ecovision-network

networks:
  ecovision-network:
    driver: bridge

volumes:
  postgres_data:
